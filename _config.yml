# Jekyll configuration for GitHub Pages.
# The home page (index.html) is a static file and is published untouched; only /blog/ is generated.
title: Juancho · notes
description: "Home Assistant, self-hosting and AI projects from my own home, by a software developer with 25+ years of experience: what worked and what didn't."
url: https://jumacabo.com
author:
  name: Juancho
  uri: https://jumacabo.com/blog/

# Search engines: sitemap.xml at the root (robots.txt points to it) and an Atom feed for the blog.
plugins:
  - jekyll-sitemap
  - jekyll-feed
feed:
  path: /blog/feed.xml
  # Posts rely on carousels, videos and their own scripts, which feed readers don't render: link to them instead.
  excerpt_only: true

# Keep every blog template inside /blog/ so the repository root stays clean.
layouts_dir: blog/_layouts
includes_dir: blog/_includes

# Posts live in blog/_posts/YYYY-MM-DD-slug.md and are published at /blog/slug/.
defaults:
  - scope:
      path: blog/_posts
      type: posts
    values:
      layout: blog-post
      permalink: /blog/:title/

# Comments: giscus on GitHub Discussions. These IDs are public identifiers, not secrets.
giscus:
  repo: jumacabo/blog-comments
  repo_id: R_kgDOVEq-fA
  category: Announcements
  category_id: DIC_kwDOVEq-fM4DHjVL
